  sourceQueries: []
archiveLayoutOverrides:
  AL002:
    relativePath: archive/cases/alpha-case/books/alpha-one
    reason: >-
      Aimed squarely at AL001's rule-DERIVED archive location. Nothing else in
      this fixture declares that path as an override, so an override-vs-override
      collision check cannot see it (AUDIT-05).
