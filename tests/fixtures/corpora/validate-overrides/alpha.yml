schemaVersion: 1
id: alpha
cases:
  - alpha-case
sourceIds:
  - prefix: AL
    padWidth: 3
    allocatable: true
requiredCapabilities:
  repositories: []
  sourceQueries: []
archiveLayoutOverrides:
  AL999:
    relativePath: cases/alpha-case/AL999/legacy
    reason: references a Source that does not exist
  BE001:
    relativePath: cases/alpha-case/BE001/legacy
    reason: references a Source belonging to another corpus
  AL001:
    relativePath: /absolute/escape/hatch
    reason: absolute path is not a relative archive path
  AL002:
    relativePath: ../../outside-the-archive
    reason: traversal escapes the archive root
  AL003:
    relativePath: cases/alpha-case/shared-location
    reason: first of two overrides colliding on one location
  AL004:
    relativePath: cases/alpha-case/./shared-location
    reason: second of two overrides colliding on one location
